name: drivethru-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  api:
    image: ghcr.io/${GH_OWNER}/drivethru-api:${IMAGE_TAG:-latest}
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      - postgres
      - redis
    ports: ["3000:3000"]

  admin:
    image: ghcr.io/${GH_OWNER}/drivethru-admin:${IMAGE_TAG:-latest}
    restart: always
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}
      NEXT_PUBLIC_REALTIME_URL: ${PUBLIC_REALTIME_URL}
    ports: ["3001:3001"]

  kds:
    image: ghcr.io/${GH_OWNER}/drivethru-kds:${IMAGE_TAG:-latest}
    restart: always
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}
      NEXT_PUBLIC_REALTIME_URL: ${PUBLIC_REALTIME_URL}
    ports: ["3003:3003"]

volumes:
  postgres-data:
  redis-data:
